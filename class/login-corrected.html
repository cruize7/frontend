<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <form action="login" method="post" enctype="multipart/form-data">
        <fieldset>
            <legend>Log in</legend>

            <p>
                <label for="l-name">Email address or number</label><br>
                <input type="text" id="l-name" name="email_or_phone" placeholder="Email address or number" required>
            </p>

            <p>
                <label for="l-password">Password</label><br>
                <input type="password" id="l-password" name="password" placeholder="Password" required>
            </p>

            <button type="submit">Login</button><br>
            <a href="exerciseregister.html">Create new account</a>
        </fieldset>
    </form>
</body>
</html>
